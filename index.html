<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b12">
<title>Character iPhone</title>
<style>
:root{--ink:#11131a;--muted:#8d929e;--glass:rgba(255,255,255,.16);--blue:#0a84ff;--green:#30d158;--wall:#101b32}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:#080a0f;color:white;overflow:hidden}
body{display:grid;place-items:center;padding:12px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.phone{height:min(900px,calc(100dvh - 24px));aspect-ratio:9/19.5;width:auto;max-width: min(430px,calc((100vw - 24px)*.462));min-width:300px;position:relative;border:8px solid #24262c;border-radius:54px;background:#000;box-shadow:0 25px 90px #000c, inset 0 0 0 2px #555;overflow:hidden}
@media(max-width:500px){body{padding:0}.phone{height:100dvh;width:100vw;max-width:none;min-width:0;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;overflow:hidden;background:linear-gradient(145deg,#536f91,#17253d 48%,#090f1d);isolation:isolate}
.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 24%,#b5c9d8aa 0,transparent 25%),radial-gradient(ellipse at 28% 75%,#647b9b 0,transparent 35%),linear-gradient(155deg,#728da6 0%,#314967 40%,#101a31 100%);z-index:-2}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#08101dd9,transparent 62%)}
.status{position:absolute;z-index:20;top:0;left:0;right:0;height:42px;padding:12px 25px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:650;letter-spacing:.1px}
.status-right{display:flex;gap:5px;align-items:center}.signal{font-size:12px;letter-spacing:-3px}.battery{width:19px;height:10px;border:1px solid white;border-radius:3px;position:relative}.battery:before{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:70%;background:white;border-radius:1px}.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:white;border-radius:0 2px 2px 0}
.dynamic{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:92px;height:25px;background:#000;border-radius:18px;z-index:21}
.lock{position:absolute;inset:0;z-index:10;text-align:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.lock.hidden{transform:translateY(-105%);opacity:0;pointer-events:none}
.lock-date{margin-top:104px;font-size:19px;font-weight:500;text-shadow:0 1px 8px #0004}.lock-time{font-size:clamp(66px,17vw,88px);font-weight:300;letter-spacing:-5px;line-height:1.08;text-shadow:0 2px 15px #0003}
.lock-bottom{position:absolute;bottom:24px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:16px}
.lock-hint{font-size:13px;text-shadow:0 1px 5px #0008}.swipe-bar{width:126px;height:5px;background:#fff;border-radius:8px;box-shadow:0 1px 4px #0005}
.flashlight-row{width:100%;display:flex;justify-content:space-between;padding:0 34px 8px}.round-control{width:43px;height:43px;border-radius:50%;background:#ffffff35;backdrop-filter:blur(12px);display:grid;place-items:center;font-size:20px}
.passcode{position:absolute;inset:0;z-index:12;display:none;align-items:center;flex-direction:column;padding-top:112px;background:#101b32b8;backdrop-filter:blur(28px);text-align:center}
.passcode.show{display:flex;animation:fade .22s}.passcode h2{font-size:19px;font-weight:600;margin:0 0 9px}.passcode p{font-size:14px;color:#e5e9f2;margin:0 0 28px}
.dots{display:flex;gap:17px;margin-bottom:34px}.dot{width:12px;height:12px;border:1px solid white;border-radius:50%}.dot.filled{background:white}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:12px 18px}.key{height:58px;width:58px;border-radius:50%;background:#ffffff25;backdrop-filter:blur(12px);font-size:27px;font-weight:350;display:grid;place-items:center}.key small{font-size:8px;letter-spacing:1px;display:block;margin-top:-5px}.key:active{background:#ffffff55}.pass-actions{width:100%;display:flex;justify-content:space-between;padding:25px 38px;font-size:13px}.error{height:18px;color:#ffb4b4;font-size:13px;margin-top:8px}
.home{position:absolute;inset:0;z-index:2;padding:65px 20px 35px;display:none;flex-direction:column;opacity:0;transition:opacity .35s}
.home.show{display:flex;opacity:1}
.widget-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.widget{height:112px;border-radius:20px;padding:13px;background:#ffffff24;backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px #ffffff18}
.widget .small{font-size:11px;color:#e2e8f0}.widget .big{font-size:27px;font-weight:550;margin-top:10px}.widget .sub{font-size:11px;color:#e2e8f0;margin-top:3px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;align-content:start}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;min-width:0}
.icon-art{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;font-size:29px;box-shadow:0 3px 10px #0003,inset 0 0 0 1px #ffffff24}
.app-name{font-size:10px;text-shadow:0 1px 4px #0008;white-space:nowrap}
.dock{margin-top:auto;height:83px;border-radius:27px;background:#ffffff30;backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px 9px}
.dock .app-name{display:none}.dock .icon-art{width:52px;height:52px}
.app-view{position:absolute;inset:0;z-index:15;background:#f2f2f7;color:#17171b;display:none;flex-direction:column;opacity:0;transform:scale(.96);transition:opacity .2s,transform .2s}
.app-view.open{display:flex;opacity:1;transform:scale(1)}
.app-status{height:49px;flex:none;padding:12px 25px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:650;color:#17171b}
.app-header{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #d8d8dd;flex:none}
.app-header h2{font-size:20px;margin:0;font-weight:700}.back{color:var(--blue);background:none;font-size:16px;padding:6px 0}.action{background:none;color:var(--blue);font-size:15px}
.app-content{overflow:auto;flex:1;padding:15px 16px 35px}
.home-indicator{height:5px;width:135px;background:#17171b;border-radius:8px;margin:7px auto 8px;flex:none}
.search{width:100%;border:0;border-radius:10px;background:#e3e3e8;padding:10px 12px;font-size:15px;margin-bottom:14px;outline:none;color:#222}
.section-label{font-size:12px;color:#777;text-transform:uppercase;margin:17px 5px 7px;font-weight:600}
.contact{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #ddd;cursor:pointer}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:650;font-size:15px;flex:none;background:linear-gradient(145deg,#8ba5c7,#4b668e)}
.contact-info{min-width:0;flex:1}.contact-name{font-size:16px;font-weight:550}.contact-sub{font-size:12px;color:#888;margin-top:3px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photo{aspect-ratio:1;background-size:cover;background-position:center;position:relative;overflow:hidden}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff25,transparent 45%,#0003)}
.photo:nth-child(6n+1){background-image:radial-gradient(circle at 65% 30%,#e7c9a8,transparent 18%),linear-gradient(140deg,#9db7c6,#455c72 55%,#172d45)}
.photo:nth-child(6n+2){background-image:linear-gradient(35deg,#263b50 20%,transparent 20%),linear-gradient(145deg,#e5b99a,#b67d70 50%,#5a5263)}
.photo:nth-child(6n+3){background-image:radial-gradient(ellipse at 50% 30%,#f4d5b8 0 13%,transparent 14%),linear-gradient(160deg,#a5c5bd,#4e7978 55%,#233b50)}
.photo:nth-child(6n+4){background-image:linear-gradient(120deg,#e8cba2,#8e9b9d 48%,#3b5369)}
.photo:nth-child(6n+5){background-image:radial-gradient(circle at 60% 40%,#f0d2b8 0 15%,transparent 16%),linear-gradient(145deg,#b9a3b5,#5e617d 55%,#222d48)}
.photo:nth-child(6n){background-image:linear-gradient(155deg,#c2d3d7,#68828d 45%,#263c54)}
.photo-detail{position:absolute;inset:0;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;color:white;z-index:2}
.photo-detail.show{display:flex}.photo-detail .large-photo{width:100%;height:65%;background:linear-gradient(145deg,#a8bdc9,#324b68 60%,#101a2b)}
.photo-detail button{background:none;color:white;padding:15px}
.message-list{background:white;border-radius:12px;overflow:hidden}.thread{display:flex;gap:11px;padding:12px;border-bottom:1px solid #e6e6e9;align-items:center;cursor:pointer}.thread .avatar{width:42px;height:42px}.thread small{display:block;color:#8a8a90;margin-top:4px}
.chat{display:flex;flex-direction:column;gap:9px}.bubble{max-width:80%;padding:10px 14px;border-radius:19px;font-size:15px;line-height:1.3}.bubble.in{align-self:flex-start;background:#e5e5ea;border-bottom-left-radius:5px}.bubble.out{align-self:flex-end;background:#0a84ff;color:white;border-bottom-right-radius:5px}
.chat-compose{display:flex;gap:8px;padding:10px 12px;background:#f8f8fa;border-top:1px solid #ddd}.chat-compose input{flex:1;border:1px solid #c8c8ce;border-radius:20px;padding:9px 13px;font-size:15px;min-width:0}.send{background:var(--blue);border-radius:18px;padding:0 15px}
.detail-card{background:white;border-radius:13px;padding:15px;margin-bottom:12px}.detail-card h3{margin:0 0 8px;font-size:16px}.detail-card p{color:#777;font-size:13px;line-height:1.5;margin:0}
.camera-screen{flex:1;background:#16181d;display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;text-align:center;padding:24px}.camera-preview{width:100%;aspect-ratio:3/4;background:#292d35;border-radius:18px;overflow:hidden;display:grid;place-items:center;color:#aeb4c0}.camera-preview video{width:100%;height:100%;object-fit:cover}.camera-actions{display:flex;gap:18px;margin-top:20px}.camera-actions button{background:#ffffff25;border-radius:22px;padding:12px 17px}
.toast{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:30;background:#222d;color:white;padding:9px 15px;border-radius:18px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="phone" id="phone">
 <div class="screen">
  <div class="wallpaper"></div>
  <div class="status"><span id="statusTime">9:41</span><div class="dynamic"></div><div class="status-right"><span class="signal">▂▄▆</span><span>⌁</span><span class="battery"></span></div></div>
  <section class="lock" id="lock">
   <div class="lock-date" id="lockDate">Monday, November 2</div><div class="lock-time" id="lockTime">9:41</div>
   <div class="lock-bottom"><div class="flashlight-row"><button class="round-control" aria-label="Flashlight" onclick="toast('Flashlight is unavailable in this preview')">⌁</button><button class="round-control" aria-label="Camera" onclick="showPasscode()">◎</button></div><div class="lock-hint">Swipe up to unlock</div><div class="swipe-bar"></div></div>
  </section>
  <section class="passcode" id="passcode">
   <h2>Enter Passcode</h2><p>Enter your passcode to unlock iPhone</p><div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
   <div class="keypad">
    <button class="key" onclick="digit('1')">1</button><button class="key" onclick="digit('2')">2<small>ABC</small></button><button class="key" onclick="digit('3')">3<small>DEF</small></button>
    <button class="key" onclick="digit('4')">4<small>GHI</small></button><button class="key" onclick="digit('5')">5<small>JKL</small></button><button class="key" onclick="digit('6')">6<small>MNO</small></button>
    <button class="key" onclick="digit('7')">7<small>PQRS</small></button><button class="key" onclick="digit('8')">8<small>TUV</small></button><button class="key" onclick="digit('9')">9<small>WXYZ</small></button>
    <span></span><button class="key" onclick="digit('0')">0</button><span></span>
   </div><div class="error" id="error"></div><div class="pass-actions"><button onclick="hidePasscode()">Cancel</button><button onclick="eraseDigit()">Delete</button></div>
  </section>
  <section class="home" id="home">
   <div class="widget-row"><div class="widget"><div class="small">MONDAY · NOVEMBER 2</div><div class="big" id="homeDay">2</div><div class="sub">No events today</div></div><div class="widget"><div class="small">WEATHER</div><div class="big">☀ 24°</div><div class="sub">Partly cloudy</div></div></div>
   <div class="app-grid" id="appGrid"></div>
   <div class="dock" id="dock"></div>
  </section>
  <div class="app-view" id="appView"><div class="app-status"><span id="appTime">9:41</span><span>▂▄▆  ⌁  ▰</span></div><div class="app-header"><button class="back" id="backButton" onclick="closeApp()">‹ Home</button><h2 id="appTitle">Contacts</h2><button class="action" id="appAction"></button></div><div class="app-content" id="appContent"></div><div class="home-indicator"></div></div>
  <div class="toast" id="toast"></div>
 </div>
</div>
<script>
const PASSCODE='0215';
let entered='', activeThread=null, cameraStream=null;
const apps=[
 ['FaceTime','📹','#27c45a'],['Calendar','📅','#fff'],['Photos','🌈','#fff'],['Camera','📷','#555'],
 ['Mail','✉️','#1687ed'],['Notes','📝','#fff'],['Reminders','☑️','#fff'],['Clock','⏱️','#111'],
 ['Maps','🗺️','#fff'],['Weather','🌤️','#64b9ee'],['App Store','🅰️','#1687ed'],['Settings','⚙️','#8e9299'],
 ['Phone','📞','#30c65a'],['Messages','💬','#20c96b'],['Safari','🧭','#fff'],['Music','🎵','#f33']
];
const contacts=[
 {name:'Astheria Arceta',nick:'Asther',initial:'AA',color:'#b88e9d',phone:'+63 917 000 0215',last:'Are you coming later?'},
 {name:'Maximo Lim',nick:'Max',initial:'ML',color:'#718aa8',phone:'+63 918 000 0215',last:'HAHAHA you have to see this'},
 {name:'Skylar Catacutan',nick:'Sky',initial:'SC',color:'#8b9b81',phone:'+63 919 000 0215',last:'I left it on your desk.'},
 {name:'Armageddon Apuli',nick:'Ged',initial:'GA',color:'#897aa8',phone:'+63 920 000 0215',last:'Call me when you can.'},
 {name:'Sadie Sevilleja',nick:'Sadie',initial:'SS',color:'#b18a70',phone:'+63 921 000 0215',last:'Good night!!'},
 {name:'Jairus Sace Robles',nick:'Jace',initial:'JR',color:'#708f91',phone:'+63 922 000 0215',last:'I sent you the photos.'},
 {name:'Mazielle Ricalde',nick:'Maze',initial:'MR',color:'#a67e9b',phone:'+63 923 000 0215',last:'Did you eat already?'},
 {name:'Acielo Vergara',nick:'Cielo',initial:'AV',color:'#7187aa',phone:'+63 924 000 0215',last:'I’ll be there after practice.'}
];
const threads={
 'Astheria Arceta':[['in','Are you coming later?'],['out','I might. What time?'],['in','Around seven. Max is bringing everyone.']],
 'Maximo Lim':[['in','HAHAHA you have to see this'],['out','What did you do now?'],['in','Nothing. That’s the problem.']],
 'Skylar Catacutan':[['in','I left it on your desk.'],['out','Got it, thank you.']],
 'Armageddon Apuli':[['in','Call me when you can.'],['out','Is everything okay?']],
 'Sadie Sevilleja':[['in','Good night!!'],['out','Good night. Sleep well.']],
 'Jairus Sace Robles':[['in','I sent you the photos.'],['out','Looking at them now.']],
 'Mazielle Ricalde':[['in','Did you eat already?'],['out','Not yet. You?']],
 'Acielo Vergara':[['in','I’ll be there after practice.'],['out','Okay. Take your time.']]
};
const scriptedReplies={
 'Astheria Arceta':['I’ll tell you when I get there.','You always ask that. 😭','Anyway, don’t forget what I told you.'],
 'Maximo Lim':['You’re no fun.','I’m literally just telling you.','HAHAHAHA wait.'],
 'Skylar Catacutan':['Okay, noted.','I’ll see you later.','Don’t overthink it.'],
 'Armageddon Apuli':['It’s nothing.','I’ll explain when I see you.','Just call me, okay?'],
 'Sadie Sevilleja':['That’s so sweet.','Wait, really?','Tell me everything later!'],
 'Jairus Sace Robles':['Check the last one.','I knew you’d like it.','Send me yours too.'],
 'Mazielle Ricalde':['I’m fine, promise.','You should eat too.','I’ll message you later.'],
 'Acielo Vergara':['Practice just ended.','I’ll call you in a bit.','Did you get home?']
};
const colors={FaceTime:'#32c65b',Calendar:'#fff',Photos:'#fff',Camera:'#555',Mail:'#1687ed',Notes:'#fff',Reminders:'#fff',Clock:'#151515',Maps:'#fff',Weather:'#63b8ec','App Store':'#1687ed',Settings:'#8e9299',Phone:'#30c65a',Messages:'#22c96b',Safari:'#fff',Music:'#ef426f'};
function iconMarkup(a){return `<span class="icon-art" style="background:${a[2]}">${a[1]}</span><span class="app-name">${a[0]}</span>`}
function buildHome(){const grid=document.getElementById('appGrid'),dock=document.getElementById('dock');grid.innerHTML='';dock.innerHTML='';apps.forEach((a,i)=>{const b=document.createElement('button');b.className='app-icon';b.innerHTML=iconMarkup(a);b.onclick=()=>openApp(a[0]);(i>=12?dock:grid).appendChild(b)})}
function updateTime(){const d=new Date();let t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});document.getElementById('statusTime').textContent=t;document.getElementById('appTime').textContent=t;document.getElementById('lockTime').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});document.getElementById('lockDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});document.getElementById('homeDay').textContent=d.getDate()}
function sound(freq=520,duration=.07,type='sine'){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration)}catch(e){}}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function showPasscode(){document.getElementById('passcode').classList.add('show');entered='';drawDots();document.getElementById('error').textContent=''}
function hidePasscode(){document.getElementById('passcode').classList.remove('show')}
function drawDots(){[...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('filled',i<entered.length))}
function digit(n){if(entered.length>=4)return;entered+=n;drawDots();sound(650,.045);if(entered.length===4)setTimeout(checkCode,170)}
function eraseDigit(){entered=entered.slice(0,-1);drawDots();sound(380,.04)}
function checkCode(){if(entered===PASSCODE){sound(800,.12);hidePasscode();document.getElementById('lock').classList.add('hidden');document.getElementById('home').classList.add('show')}else{sound(180,.18,'triangle');document.getElementById('error').textContent='Incorrect passcode. Try again.';document.getElementById('passcode').classList.add('shake');setTimeout(()=>document.getElementById('passcode').classList.remove('shake'),400);setTimeout(()=>{entered='';drawDots()},450)}}
function openApp(name){sound(520,.05);const view=document.getElementById('appView');document.getElementById('appTitle').textContent=name;document.getElementById('appAction').textContent='';document.getElementById('appContent').innerHTML='';view.classList.add('open');renderApp(name)}
function closeApp(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}document.getElementById('appView').classList.remove('open');activeThread=null;sound(420,.05)}
function avatar(c){return `<div class="avatar" style="background:${c.color}">${c.initial}</div>`}
function renderApp(name){
 const el=document.getElementById('appContent');
 if(name==='Contacts'){document.getElementById('appAction').textContent='+';el.innerHTML='<input class="search" placeholder="Search" oninput="filterContacts(this.value)"><div class="section-label">All Contacts</div><div id="contactRows"></div>';drawContacts(contacts);return}
 if(name==='Photos'){el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin:0 2px 13px"><b>Library</b><span style="color:#888;font-size:12px">Recent · 24 Items</span></div><div class="photo-grid" id="photoGrid"></div><div class="photo-detail" id="photoDetail"><button onclick="closePhoto()">✕ Close</button><div class="large-photo"></div><div style="padding:14px">A memory · Recent</div></div>';for(let i=0;i<24;i++){let p=document.createElement('div');p.className='photo';p.onclick=()=>openPhoto();el.querySelector('#photoGrid').appendChild(p)}return}
 if(name==='Messages'){el.innerHTML='<input class="search" placeholder="Search"><div class="message-list">'+contacts.map(c=>`<div class="thread" onclick="openThread('${c.name.replace(/'/g,"\\'")}')">${avatar(c)}<div style="flex:1"><b>${c.name}</b><small>${c.last}</small></div><span style="color:#aaa">›</span></div>`).join('')+'</div>';return}
 if(name==='Phone'){el.innerHTML='<div class="detail-card"><h3>Favourites</h3><p>No favourites yet</p></div><div class="section-label">Recents</div>'+contacts.slice(0,5).map(c=>`<div class="contact" onclick="toast('Calling ${c.nick}…')">${avatar(c)}<div class="contact-info"><div class="contact-name">${c.name}</div><div class="contact-sub">mobile · yesterday</div></div><span style="color:#30a85b">☎</span></div>`).join('');return}
 if(name==='Camera'){el.innerHTML='<div class="camera-screen"><div class="camera-preview" id="cameraPreview">Camera preview<br><small>Tap Enable Camera to request permission</small></div><div class="camera-actions"><button onclick="enableCamera()">Enable Camera</button><button onclick="takePhoto()">◉</button></div><p style="font-size:11px;color:#aaa">Camera access requires your permission and a secure HTTPS page.</p></div>';return}
 const info={
 'FaceTime':['FaceTime','Start a video call with a contact.','Video calling is a preview feature.'],
 'Calendar':['Monday, November 2','No events scheduled today.','Your character’s calendar entries can be added later.'],
 'Mail':['Inbox','No Mail','Your character’s email inbox will appear here.'],
 'Notes':['Notes','No Notes','Create notes for your character in a later customization pass.'],
 'Reminders':['Reminders','No reminders','Nothing on the list.'],
 'Clock':['World Clock','Manila · 9:41','Alarm · Stopwatch · Timer'],

function drawContacts(list){const r=document.getElementById('contactRows');if(!r)return;r.innerHTML=list.map(c=>`<div class="contact" onclick="contactDetail('${c.name.replace(/'/g,"\\'")}')">${avatar(c)}<div class="contact-info"><div class="contact-name">${c.name}</div><div class="contact-sub">${c.phone}</div></div><span style="color:#aaa">›</span></div>`).join('')}
function filterContacts(q){drawContacts(contacts.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.nick.toLowerCase().includes(q.toLowerCase())))}
function contactDetail(name){const c=contacts.find(x=>x.name===name);document.getElementById('appTitle').textContent=c.name;document.getElementById('appAction').textContent='Edit';document.getElementById('appContent').innerHTML=`<div style="text-align:center;padding:24px">${avatar({...c,initial:c.initial})}<h2 style="margin:12px 0 3px">${c.name}</h2><div style="color:#888">${c.nick}</div></div><div class="detail-card"><p>mobile</p><h3 style="color:#1687ed;margin-top:5px">${c.phone}</h3></div><div class="detail-card"><button class="action" onclick="openThread('${c.name.replace(/'/g,"\\'")}')">Message</button>　<button class="action" onclick="toast('Calling ${c.nick}…')">Call</button></div>`}
function openThread(name){activeThread=name;document.getElementById('appTitle').textContent=name;document.getElementById('appAction').textContent='';let msgs=threads[name]||[];document.getElementById('appContent').innerHTML=`<div class="chat" id="chat">${msgs.map(m=>`<div class="bubble ${m[0]}">${m[1]}</div>`).join('')}</div><div class="chat-compose"><input id="chatInput" placeholder="iMessage" onkeydown="if(event.key==='Enter')sendMessage()"><button class="send" onclick="sendMessage()">↑</button></div>`;document.getElementById('appContent').scrollTop=99999}
function sendMessage(){const input=document.getElementById('chatInput');if(!input||!input.value.trim())return;let value=input.value.trim(),chat=document.getElementById('chat');chat.insertAdjacentHTML('beforeend',`<div class="bubble out">${escapeHtml(value)}</div>`);input.value='';sound(600,.05);let replies=scriptedReplies[activeThread]||['I’ll get back to you.'];setTimeout(()=>{if(!document.getElementById('chat'))return;let reply=replies[Math.floor(Math.random()*replies.length)];document.getElementById('chat').insertAdjacentHTML('beforeend',`<div class="bubble in">${reply}</div>`);document.getElementById('appContent').scrollTop=99999;sound(500,.06)},900)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openPhoto(){document.getElementById('photoDetail').classList.add('show')}function closePhoto(){document.getElementById('photoDetail').classList.remove('show')}
async function enableCamera(){try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});let preview=document.getElementById('cameraPreview');preview.innerHTML='<video autoplay playsinline></video>';preview.querySelector('video').srcObject=cameraStream;toast('Camera enabled')}catch(e){toast('Camera permission was not granted')}}
function takePhoto(){let v=document.querySelector('#cameraPreview video');if(!v){toast('Enable the camera first');return}let canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;canvas.getContext('2d').drawImage(v,0,0);toast('Photo captured in preview (not saved)')}
let startY=0;document.getElementById('lock').addEventListener('touchstart',e=>startY=e.touches[0].clientY);document.getElementById('lock').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>45)showPasscode()});document.getElementById('lock').addEventListener('mousedown',e=>startY=e.clientY);document.getElementById('lock').addEventListener('mouseup',e=>{if(startY-e.clientY>45)showPasscode()});document.getElementById('lock').addEventListener('click',e=>{if(e.target.closest('button'))return;showPasscode()});
document.addEventListener('keydown',e=>{if(document.getElementById('passcode').classList.contains('show')){if(/^\d$/.test(e.key))digit(e.key);if(e.key==='Backspace')eraseDigit();if(e.key==='Escape')hidePasscode()}});
