AppStore:`<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#1688e8"/><g stroke="white" stroke-width="4.2" stroke-linecap="round" fill="none"><path d="M20 43L39 12M31 43L15 17M12 34h36"/></g></svg>`,
Music:`<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#ed4778"/><path d="M35 13v27a7 7 0 11-4-6V20l17-4v19a7 7 0 11-4-6V11z" fill="white"/></svg>`};
const apps=[["FaceTime","FaceTime"],["Calendar","Calendar"],["Photos","Photos"],["Camera","Camera"],["Mail","Mail"],["Notes","Notes"],["Reminders","Reminders"],["Clock","Clock"],["Maps","Maps"],["Weather","Weather"],["App Store","AppStore"],["Settings","Settings"],["Phone","Phone"],["Messages","Messages"],["Safari","Safari"],["Music","Music"]];
function appBtn(n,k){return `<button class="app" onclick="openApp('${n}')"><span class="icon">${svg[k]||svg.Settings}</span><span class="app-label">${n}</span></button>`}
function build(){grid.innerHTML=apps.slice(0,12).map(a=>appBtn(...a)).join("");dock.innerHTML=apps.slice(12).map(a=>appBtn(...a)).join("")}
function tick(){let d=new Date(),t=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:false});time.textContent=t;appTime.textContent=t;clock.textContent=t;date.textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});day.textContent=d.getDate();month.textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"long"}).toUpperCase()}
function sound(f=540,d=.055,type="sine"){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove("show"),1600)}
function showPass(){pass.classList.add("show");code="";dotsDraw();error.textContent=""}function cancelPass(){pass.classList.remove("show")}
function dotsDraw(){document.querySelectorAll(".dot").forEach((x,i)=>x.classList.toggle("on",i<code.length))}
function digit(n){if(code.length===4)return;code+=n;dotsDraw();sound(620,.045);if(code.length===4)setTimeout(check,160)}
function del(){code=code.slice(0,-1);dotsDraw();sound(390,.04)}
function check(){if(code===PASS){sound(780,.12);pass.classList.remove("show");lock.classList.add("gone");home.classList.add("show")}else{sound(170,.16,"triangle");pass.classList.add("shake");error.textContent="Incorrect Passcode";setTimeout(()=>{pass.classList.remove("shake");code="";dotsDraw()},420)}}
function openApp(n){sound(500,.04);app=n;mode="root";title.textContent=n;back.textContent="‹ Home";action.textContent="";content.style.padding="15px 16px 24px";render(n);appwin.classList.add("open")}
function closeApp(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}appwin.classList.remove("open")}
function back(){if(mode==="chat"){messages();return}if(mode==="profile"){contactsView();return}closeApp()}
function nav(t,b="‹ Home",a=""){title.textContent=t;back.textContent=b;action.textContent=a}
function avatar(p,extra=""){return `<div class="avatar ${extra}" style="background:${p[3]}">${p[2]}</div>`}
function render(n){if(n==="Contacts"){contactsView();return}if(n==="Photos"){photosView();return}if(n==="Messages"){messages();return}if(n==="Phone"){phoneView();return}if(n==="Camera"){cameraView();return}
let data={"FaceTime":["FaceTime","Start a video call with a contact.","Video calling is a visual prototype feature."],"Calendar":["No events today","Your calendar is clear.","Character-specific events can be added later."],"Mail":["Inbox","No Mail","Ayira’s email inbox will appear here."],"Notes":["Notes","No Notes","Personal notes can be added later."],"Reminders":["Reminders","No reminders","Nothing on the list."],"Clock":["World Clock","Manila · 9:41","Alarm　Stopwatch　Timer"],"Maps":["Maps","Search for a place","Map features can be integrated later."],"Weather":["Manila","24° · Partly Cloudy","Feels like 26° · H:29° L:23°"],"App Store":["App Store","Discover apps","This is a fictional device interface."],"Settings":["Settings","Airplane Mode　Wi-Fi　Bluetooth","Wallpaper　Sounds　Passcode"],"Safari":["Safari","Search or enter website name","Browser preview."],"Music":["Recently Played","Nothing playing","Ayira’s playlists can be added later."]}[n]||[n,"Welcome","This app is ready for customization."];content.innerHTML=`<div class="empty"><h3>${data[0]}</h3><p>${data[1]}</p></div><div class="empty"><p>${data[2]}</p></div>`}
function contactsView(){mode="root";nav("Contacts","‹ Home","+");content.innerHTML=`<input class="search" placeholder="Search" oninput="filter(this.value)"><div class="section">All Contacts</div><div id="rows"></div>`;drawRows(people)}
function drawRows(list){let r=document.getElementById("rows");if(!r)return;r.innerHTML=list.map(p=>`<div class="row" onclick="profile('${p[0]}')">${avatar(p)}<div class="row-main"><div class="row-name">${p[0]}</div></div><span class="chev">›</span></div>`).join("")}
function filter(q){drawRows(people.filter(p=>(p[0]+p[1]).toLowerCase().includes(q.toLowerCase())))}
function profile(name){person=people.find(p=>p[0]===name);mode="profile";nav("Contact","‹ Contacts","Edit");content.innerHTML=`<div class="profile">${avatar(person,"")}<div class="profile-name">${person[0]}</div><div class="profile-nick">${person[1]}</div><div class="profile-actions"><button onclick="chat('${person[0]}')"><span>✉</span>message</button><button onclick="toast('Calling ${person[1]}…')"><span>☎</span>call</button><button onclick="toast('FaceTime preview')"><span>▣</span>video</button></div></div><div class="card"><div class="info"><div class="muted">mobile</div>${person[4]}</div><div class="info"><div class="muted">note</div>Character contact</div></div>`}
function photosView(){mode="root";nav("Photos","‹ Home","Select");content.innerHTML=`<div class="photohead"><strong>Library</strong><span>Recent · 24 Photos</span></div><div class="photos" id="photos"></div><p style="font-size:12px;color:#777">Temporary visual placeholders. Ayira’s actual camera roll can be added next.</p><div class="viewer" id="viewer"><button onclick="viewer.classList.remove('show')">✕　Close</button><div class="viewer-art"></div><span style="padding:15px">A memory · Recent</span></div>`;for(let i=0;i<24;i++){let x=document.createElement("div");x.className="tile";x.innerHTML=`<div class="art p${i%6+1}"></div>`;x.onclick=()=>viewer.classList.add("show");photos.appendChild(x)}}
function messages(){mode="root";nav("Messages","‹ Home","Edit");content.innerHTML=`<input class="search" placeholder="Search"><div id="threads"></div>`;threads.innerHTML=people.map(p=>`<div class="threads" onclick="chat('${p[0]}')">${avatar(p)}<div class="threadmain"><div class="threadname">${p[0]}</div><div class="preview">${p[5]}</div></div><span class="chev">›</span></div>`).join("")}
function chat(name){person=people.find(p=>p[0]===name);mode="chat";nav(person[1],"‹ Messages","");content.style.padding="8px 12px 5px";let list=chats[name]||[];content.innerHTML=`<div class="chat" id="chatlog"><div class="chatdate">iMessage · Today</div>${list.map(m=>`<div class="bubble ${m[0]}">${esc(m[1])}</div>`).join("")}</div><div class="compose"><input id="msg" placeholder="iMessage" onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">↑</button></div>`}
function send(){let input=document.getElementById("msg");if(!input||!input.value.trim())return;let v=input.value.trim(),log=document.getElementById("chatlog");log.insertAdjacentHTML("beforeend",`<div class="bubble out">${esc(v)}</div>`);input.value="";sound(620,.05);let arr=replies[person[0]]||["I’ll get back to you."],reply=arr[Math.floor(Math.random()*arr.length)];setTimeout(()=>{if(mode!=="chat"||!document.getElementById("chatlog"))return;chatlog.insertAdjacentHTML("beforeend",`<div class="bubble in">${esc(reply)}</div>`);content.scrollTop=content.scrollHeight;sound(520,.06)},850)}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function phoneView(){mode="root";nav("Phone","‹ Home","Edit");content.innerHTML=`<div class="section">Recents</div>`+people.slice(0,6).map(p=>`<div class="recent">${avatar(p)}<div class="meta"><b>${p[0]}</b><small>mobile · yesterday</small></div><button class="action" onclick="toast('Calling ${p[1]}…')">☎</button></div>`).join("")}
function cameraView(){mode="root";nav("Camera","‹ Home","");content.style.padding="0";content.innerHTML=`<div class="camera"><div class="previewcam" id="camPreview">Camera preview<br><small>Enable camera to request permission</small></div><div class="camcontrols"><button onclick="enableCam()">Enable Camera</button><button onclick="capture()">◉</button></div><p class="camhelp">Camera requires HTTPS and your permission. GitHub Pages supports HTTPS.</p></div>`}
async function enableCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});camPreview.innerHTML="<video autoplay playsinline></video>";camPreview.querySelector("video").srcObject=stream;toast("Camera enabled")}catch(e){toast("Camera permission was not granted")}}
function capture(){let v=document.querySelector("#camPreview video");if(!v){toast("Enable the camera first");return}let c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);toast("Preview captured — not saved")}
let sy=0;lock.addEventListener("touchstart",e=>sy=e.touches[0].clientY,{passive:true});lock.addEventListener("touchend",e=>{if(sy-e.changedTouches[0].clientY>45)showPass()},{passive:true});lock.addEventListener("mousedown",e=>sy=e.clientY);lock.addEventListener("mouseup",e=>{if(sy-e.clientY>45)showPass()});lock.addEventListener("click",e=>{if(!e.target.closest("button"))showPass()});document.addEventListener("keydown",e=>{if(pass.classList.contains("show")){if(/^\d$/.test(e.key))digit(e.key);if(e.key==="Backspace")del();if(e.key==="Escape")cancelPass()}});build();tick();setInterval(tick,15000);
</script></div></div></body></html>
